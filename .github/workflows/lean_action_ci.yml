name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      # Documentation deploy needs GitHub Pages enabled on this repo; it is not.
      # Without continue-on-error the run is permanently red, which makes a genuine
      # Lean build failure indistinguishable from this one. A red run must mean
      # "Lean broke" and nothing else.
      - uses: leanprover-community/docgen-action@v1
        continue-on-error: true

name = "tworow_d4_kernel"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["TworowD4Kernel"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "TworowD4Kernel"
globs = ["TworowD4Kernel", "TworowD4Kernel.+"]
